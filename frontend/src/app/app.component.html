<router-outlet />
<app-toast-container />
<app-confirm-dialog />

@if (isOffline()) {
  <div class="fixed bottom-4 right-4 z-[9999] flex items-center gap-3 px-5 py-3 rounded-2xl bg-rose-950/90 text-rose-200 border border-rose-800/30 shadow-2xl backdrop-blur-md animate-pulse">
    <div class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></div>
    <div class="flex flex-col animate-none">
      <span class="text-xs font-bold uppercase tracking-wider">Modo Offline</span>
      <span class="text-[10px] text-rose-300">Trabajando sin conexión</span>
    </div>
  </div>
}

@if (showReconnected()) {
  <div class="fixed bottom-4 right-4 z-[9999] flex items-center gap-3 px-5 py-3 rounded-2xl bg-emerald-950/90 text-emerald-200 border border-emerald-800/30 shadow-2xl backdrop-blur-md">
    <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
    <div class="flex flex-col">
      <span class="text-xs font-bold uppercase tracking-wider">¡Conectado!</span>
      <span class="text-[10px] text-emerald-300">Sincronizando cambios...</span>
    </div>
  </div>
}
